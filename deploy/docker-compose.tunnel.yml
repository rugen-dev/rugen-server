# rugen-server behind a Cloudflare Tunnel only: no published ports, no UDP.
# For Dokploy "Compose" apps from this Git repository (compose path
# ./deploy/docker-compose.tunnel.yml). The image is built on the host from
# this repo, so no registry login is needed. Matches use the WebSocket relay
# through the tunnel.
#
# Tunnel public hostname: play.example.com → HTTP → http://rugen-server:8080
# (cloudflared must share a network with this service: dokploy-network here).
#
# This is also the OFFICIAL server profile (play.rugen.dev): set the secret
# RUGEN_SIGNING_KEY (from `rugen-server --gen-key`) and RUGEN_ADMIN_TOKEN in
# Dokploy's Environment tab; without the official key the server runs as a
# community server. See deploy/README.md "Official server".

name: rugen

services:
  rugen-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: rugen-server:local
    container_name: rugen-server
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      RUGEN_BIND: 0.0.0.0:8080
      RUGEN_UDP_BIND: "off"
      # no UDP relay advertised either: clients go straight to /relay (WebSocket)
      RUGEN_UDP_PUBLIC: "off"
      RUGEN_DATA: /data
      RUGEN_PUBLIC_URL: ${RUGEN_PUBLIC_URL:-}
      RUGEN_NAME: ${RUGEN_NAME:-rugen server}
      RUGEN_MOTD: ${RUGEN_MOTD:-}
      RUST_LOG: ${RUST_LOG:-info}
      # character packages: disk and bandwidth stay small next to other apps
      RUGEN_PKG_MAX_TOTAL: ${RUGEN_PKG_MAX_TOTAL:-2GB}
      RUGEN_PKG_RATE_ACCOUNT: ${RUGEN_PKG_RATE_ACCOUNT:-500MB}
      RUGEN_PKG_RATE_IP: ${RUGEN_PKG_RATE_IP:-1GB}
      # official server: the private signing key (secret) and the admin API;
      # empty = generated community key in /data/signing.key, admin API off
      RUGEN_SIGNING_KEY: ${RUGEN_SIGNING_KEY:-}
      RUGEN_ADMIN_TOKEN: ${RUGEN_ADMIN_TOKEN:-}
      # daily off-site backups to an S3-compatible bucket (secret URL; empty = off)
      RUGEN_BACKUP_S3: ${RUGEN_BACKUP_S3:-}
      RUGEN_BACKUP_RETENTION_DAYS: ${RUGEN_BACKUP_RETENTION_DAYS:-7}
      RUGEN_BACKUP_INCLUDE: ${RUGEN_BACKUP_INCLUDE:-}
      # admin self-benchmark (POST /admin/bench); 1 = on, off by default
      RUGEN_BENCH: ${RUGEN_BENCH:-}
    volumes:
      - rugen-data:/data
    # no "ports:": only the tunnel reaches the server
    healthcheck:
      test: ["CMD", "/rugen-server", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - rugen
      - dokploy-network
    read_only: true
    # the only writable path besides /data: the self-benchmark's throw-away
    # server (in RAM, counted in mem_limit)
    tmpfs:
      - /tmp:size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # good neighbour on a shared host: hard caps, lowest priority under
    # contention, first to go if the host runs out of memory, bounded logs
    cpus: ${RUGEN_CPUS:-2.0}
    mem_limit: ${RUGEN_MEM:-1536m}
    memswap_limit: ${RUGEN_MEM:-1536m}
    cpu_shares: 256
    blkio_config:
      weight: 100
    pids_limit: 256
    # Docker starts containers with 1024 open files: about 500 players
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    oom_score_adj: 500
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  rugen:
    name: rugen
  dokploy-network:
    external: true

volumes:
  rugen-data: {}
