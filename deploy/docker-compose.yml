# rugen-server: lobby, accounts, rooms, ranked and the match relay.
# Works as a Dokploy "Compose" app. See deploy/README.md.
#
#   docker compose up -d        # optional: cp .env.example .env first
#
# Exposes 8080/tcp (HTTP + WebSocket) and 7001/udp (match relay fast path).
# Put HTTPS in front however you like: a reverse proxy, Dokploy's domains,
# or the optional Cloudflare Tunnel in deploy/cloudflared/.

name: rugen

services:
  rugen-server:
    # prebuilt image from GHCR (published on v* tags); or build locally:
    image: ${RUGEN_IMAGE:-ghcr.io/diary-axel-rakotoarivao/rugen-server:latest}
    # build:
    #   context: ..
    #   dockerfile: deploy/Dockerfile
    container_name: rugen-server
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      RUGEN_BIND: 0.0.0.0:8080
      RUGEN_UDP_BIND: ${RUGEN_UDP_BIND:-0.0.0.0:7001}
      RUGEN_DATA: /data
    volumes:
      - rugen-data:/data
    ports:
      - "${RUGEN_HTTP_PORT:-8080}:8080"
      # match relay fast path: open it in the host / VPS firewall too
      - "${RUGEN_UDP_PORT:-7001}:7001/udp"
    healthcheck:
      test: ["CMD", "/rugen-server", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - rugen
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  # fixed name so optional add-ons (deploy/cloudflared) can join it
  rugen:
    name: rugen

volumes:
  rugen-data: {}
