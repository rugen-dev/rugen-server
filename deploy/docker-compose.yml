# rugen-server + Cloudflare Tunnel. Works as a Dokploy "Compose" app.
# See deploy/README.md. Variables come from .env (Dokploy: Environment tab).
#
#   cp .env.example .env   # fill CF_TUNNEL_TOKEN, RUGEN_PUBLIC_URL, ...
#   docker compose up -d
#
# Lobby / accounts / WebSocket relay go through the tunnel (HTTPS).
# Match traffic prefers UDP 7001, published directly (a tunnel cannot carry
# UDP); without it clients fall back to the WebSocket relay automatically.

name: rugen

services:
  rugen-server:
    # prebuilt image from GHCR (published on v* tags); or build locally:
    image: ${RUGEN_IMAGE:-ghcr.io/diary-axel-rakotoarivao/rugen-server:latest}
    # build:
    #   context: ..
    #   dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUGEN_BIND: 0.0.0.0:8080
      RUGEN_UDP_BIND: 0.0.0.0:7001
      RUGEN_DATA: /data
    volumes:
      - rugen-data:/data
    ports:
      # UDP relay fast path: open 7001/udp in the host / VPS firewall too
      - "7001:7001/udp"
      # only when serving without the tunnel (plain HTTP on the host):
      # - "8080:8080"
    healthcheck:
      test: ["CMD", "/rugen-server", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - rugen
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      rugen-server:
        condition: service_healthy
    networks:
      - rugen

networks:
  rugen: {}

volumes:
  rugen-data: {}
