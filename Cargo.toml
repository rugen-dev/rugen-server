[package]
name = "rugen-relay"
description = "rugen-server: lobby, rooms, ranked (Elo), match relay over UDP / WebSocket, SQLite"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "rugen-server"
path = "src/main.rs"

[dependencies]
rugen-proto.workspace = true
rugen-fair.workspace = true
rugen-formats.workspace = true
rugen-sim = { workspace = true, optional = true }
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json = "1"
getrandom = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query"] }
argon2 = "0.5"

[features]
# re-simulate disputed ranked matches from stored packages (needs RUGEN_RESIM_DATA)
resim = ["dep:rugen-sim"]

[dev-dependencies]
rugen-net.workspace = true
rugen-content.workspace = true
rugen-sim.workspace = true
tokio-tungstenite = "0.27"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

[lints]
workspace = true
