[package]
name = "rugen-server"
description = "rugen-server: lobby, rooms, ranked (Elo), match relay over UDP / WebSocket, SQLite"
version = "0.8.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rugen-dev/rugen-server"
rust-version = "1.85"

[[bin]]
name = "rugen-server"
path = "src/main.rs"

[dependencies]
rugen-proto = { git = "https://github.com/rugen-dev/rugen-engine", tag = "v0.8.0" }
rugen-fair = { git = "https://github.com/rugen-dev/rugen-engine", tag = "v0.8.0" }
rugen-formats = { git = "https://github.com/rugen-dev/rugen-engine", tag = "v0.8.0" }
rugen-sim = { git = "https://github.com/rugen-dev/rugen-engine", tag = "v0.8.0", optional = true }
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query"] }
argon2 = "0.5"
# split + batched writes of the /relay WebSocket
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# HTTPS client: pulls the official truth feed and calls the Cloudflare TURN
# API (rustls + bundled webpki roots: the scratch image has no CA store)
ureq = { version = "3", default-features = false, features = ["rustls"] }
# RGPK packages and rugen-fp-1 fingerprints of API 4 (rugen 0.5) clients
zstd = { version = "0.13", default-features = false }
sha2 = "0.11"
# self-benchmark clients (crate::loadgen): HTTP/1.1 and WebSocket over
# loopback, the same hyper / tungstenite axum already brings
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
# global allocator: musl's is slow under many threads (the image is musl)
mimalloc = { version = "0.1", default-features = false }

# setpriority: the re-simulation thread runs at a lower priority
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[features]
# re-simulate disputed ranked matches from stored packages (needs RUGEN_RESIM_DATA)
resim = ["dep:rugen-sim"]

[dev-dependencies]
rugen-net = { git = "https://github.com/rugen-dev/rugen-engine", tag = "v0.8.0" }
rugen-content = { git = "https://github.com/rugen-dev/rugen-engine", tag = "v0.8.0" }
rugen-sim = { git = "https://github.com/rugen-dev/rugen-engine", tag = "v0.8.0" }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }

[lints.rust]
unsafe_code = "warn"
[lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
[profile.dev.package."*"]
opt-level = 2
